name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支只保留最新一次运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 最快的一层：不需要数据库、不需要跑服务，PR 里几十秒出结果
  unit:
    name: 类型 / 构建 / 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 决定；
      # 这里再写 version 会和它冲突（ERR_PNPM_BAD_PM_VERSION）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 构建产物不该混进 src，也不该有源码被 .gitignore 误伤
      - name: 检查源码目录整洁
        run: pnpm check:tracked

      # Prisma client 是生成物。db 的 typecheck 脚本已自带 generate，
      # 这里再显式跑一次，让失败时能一眼看出是生成阶段还是类型阶段的问题。
      - run: pnpm db:generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # 这两条在 CI 上都会 SKIPPED（没有 KiCad、没有 S3 配置）。
      # 留着是为了让脚本本身的语法/导入错误在这里就暴露，而不是等到
      # 有人真的装了 KiCad 才发现跑不起来。
      - name: 真实 KiCad 验证（无 CLI 时跳过）
        run: pnpm test:kicad-real
      - name: 真实存储验证（无 S3 配置时跳过）
        run: pnpm test:storage-real

  bridge:
    name: Bridge (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        working-directory: apps/m2k-bridge
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      # BRIDGE_CONFIG 指向临时文件，避免测试写到 runner 的 home
      - name: pytest
        working-directory: apps/m2k-bridge
        env:
          BRIDGE_MOCK: 'true'
          BRIDGE_REQUIRE_PAIRING: 'true'
        run: python -m pytest -q

  # MinIO 是本地容器，不消耗任何外部资源 —— 但它是真的 S3 兼容实现，
  # 能覆盖进程内假服务覆盖不到的东西（真实错误码、真实签名校验）。
  storage:
    name: 存储（MinIO 端到端）
    runs-on: ubuntu-latest
    needs: unit

    env:
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: auto
      S3_BUCKET: bdc-test
      S3_ACCESS_KEY_ID: bdc-test-key
      S3_SECRET_ACCESS_KEY: bdc-test-secret
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter @app/storage

      # 用 docker run 而不是 services：service 容器不能覆盖 command，
      # 而 minio 镜像必须显式传 `server /data`
      - name: 启动 MinIO 并建桶
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=$S3_ACCESS_KEY_ID \
            -e MINIO_ROOT_PASSWORD=$S3_SECRET_ACCESS_KEY \
            minio/minio:latest server /data
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9000/minio/health/live && ready=1 && break
            sleep 1
          done
          # 起不来就在这里失败，别让后面的建桶报一个看不懂的错
          test -n "$ready" || { echo 'MinIO 40s 内没就绪'; docker logs minio; exit 1; }

          # minio/mc 的 ENTRYPOINT 就是 mc，不覆盖的话 `sh` 会被当成 mc 子命令
          docker run --rm --network host --entrypoint sh minio/mc:latest -c "
            mc alias set local http://127.0.0.1:9000 $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY &&
            mc mb --ignore-existing local/$S3_BUCKET"

      - run: pnpm test:storage-real

      - name: 失败时导出 MinIO 日志
        if: failure()
        run: docker logs minio | tail -50

  integration:
    name: 集成（冒烟 + 智能体评测）
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bdc_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bdc_ci?schema=public
      # 集成层固定跑 mock：CI 不该消耗真实模型配额，也不该因为
      # 外部服务抖动而变成不稳定测试
      MOCK_MODE: 'true'
      LLM_PROVIDER: mock
      STORAGE_ADAPTER: mock
      AUTH_SECRET: ci-secret
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001

    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 决定；
      # 这里再写 version 会和它冲突（ERR_PNPM_BAD_PM_VERSION）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: 迁移与 seed
        run: |
          pnpm --filter @app/db exec prisma migrate deploy
          pnpm db:seed

      - name: 启动 api
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/health && break
            sleep 1
          done

      - name: 启动 web
        run: |
          cd apps/web && pnpm exec next start --port 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3000/ && break
            sleep 1
          done

      - name: 启动 bridge
        run: |
          cd apps/m2k-bridge
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          BRIDGE_MOCK=true BRIDGE_REQUIRE_PAIRING=false BRIDGE_ALLOW_UNPAIRED_DEBUG=true \
            .venv/bin/uvicorn src.main:app --host 127.0.0.1 --port 3777 > /tmp/bridge.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3777/status && break
            sleep 1
          done

      - name: 冒烟
        env:
          API: http://127.0.0.1:3001
          WEB: http://127.0.0.1:3000
          BRIDGE: http://127.0.0.1:3777
        run: pnpm smoke

      - name: 智能体评测（mock 基线）
        env:
          API: http://127.0.0.1:3001
          BRIDGE: http://127.0.0.1:3777
        run: pnpm test:agent

      - name: 失败时导出日志
        if: failure()
        run: |
          echo '--- api ---'; tail -50 /tmp/api.log || true
          echo '--- web ---'; tail -30 /tmp/web.log || true
          echo '--- bridge ---'; tail -30 /tmp/bridge.log || true
